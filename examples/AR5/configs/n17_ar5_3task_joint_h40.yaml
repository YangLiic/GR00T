# GR00T N1.7 co-training on 3 D-Robotics AR5 dual-arm real-robot tasks.
# Absolute 16-D joints, action horizon 40, supervise LeRobot action (not observation.state).
# Prompts are read from each dataset's meta/tasks.jsonl.
# Launch via gpu_slot_ctl onto t-20260907191950-fjv5z; do not use the colleague hold box.

experiment_name: n17_ar5_3task_joint_h40
embodiment_tag: NEW_EMBODIMENT
modality_config_path: examples/AR5/ar5_config.py

base_model_path: /DRoboticsAILab/vepfs_20260622/licheng.yang/Isaac-GR00T/checkpoints/GR00T-N1.7-3B
cosmos_backbone_path: /DRoboticsAILab/vepfs_20260622/licheng.yang/Isaac-GR00T/checkpoints/Cosmos-Reason2-2B
dataset_root: /DRoboticsAILab/users/licheng.yang/datasets/D-Robotics
datasets:
  - stack_and_cover_0905_ar5
  - drag_the_drawer_0901_ar5
  - assembly_workpiece_0902_ar5
output_dir: /DRoboticsAILab/users/licheng.yang/checkpoints/gr00t/n17_ar5_3task_joint_h40

copy_state_to_action: false
ds_weights_alpha: 0.0

num_gpus: 8
global_batch_size: 64
gradient_accumulation_steps: 1
max_steps: 100000
save_steps: 5000
save_total_limit: 5
learning_rate: 1.0e-4
weight_decay: 1.0e-5
warmup_ratio: 0.05
dataloader_num_workers: 4
state_dropout_prob: 0.2

tune_llm: false
tune_visual: true
tune_projector: true
tune_diffusion_model: true
use_percentiles: true
use_wandb: true
wandb_mode: offline

action_horizon: 40
action_representation: absolute
action_dim: 16
action_space: joint
cameras: [head_camera, left_wrist_camera, right_wrist_camera]
fps: 30
prompts:
  stack_and_cover_0905_ar5: stack two cubes and cover them with a cup
  drag_the_drawer_0901_ar5: open the drawer and put the cube inside
  assembly_workpiece_0902_ar5: assemble the workpiece

# GR00T N1.7 finetune on 4 D-Robotics AR5 dual-arm real-robot tasks.
# Absolute 16-D joints, action horizon 40, supervise from observation.state.
# Do not launch from this file alone; use examples/AR5/scripts/run_finetune_a800.sh.
# Paths below are A800-side.

experiment_name: n17_ar5_4task_joint_h40
embodiment_tag: NEW_EMBODIMENT
modality_config_path: examples/AR5/ar5_config.py

base_model_path: /data/efs/vepfs_20260622/licheng.yang/Isaac-GR00T/checkpoints/GR00T-N1.7-3B
cosmos_backbone_path: /data/efs/vepfs_20260622/licheng.yang/Isaac-GR00T/checkpoints/Cosmos-Reason2-2B
dataset_root: /data/efs/user/licheng.yang/datasets/D-Robotics
datasets:
  - assembly_workpiece_more_ar5
  - stack_and_cover_480_ar5
  - pick_and_place_ar5
  - drag_drawer_and_pick_place_ar5
output_dir: /data/efs/user/licheng.yang/checkpoints/gr00t/n17_ar5_4task_joint_h40

copy_state_to_action: true
ds_weights_alpha: 0.0

num_gpus: 8
global_batch_size: 64
gradient_accumulation_steps: 1
max_steps: 100000
save_steps: 5000
save_total_limit: 5
learning_rate: 1.0e-4
weight_decay: 1.0e-5
warmup_ratio: 0.05
dataloader_num_workers: 4
state_dropout_prob: 0.2

tune_llm: false
tune_visual: true
tune_projector: true
tune_diffusion_model: true
use_percentiles: true
use_wandb: true
wandb_mode: offline

action_horizon: 40
action_representation: absolute
action_dim: 16
action_space: joint
cameras: [head_camera, left_wrist_camera, right_wrist_camera]
fps: 30
prompts:
  assembly_workpiece_more_ar5: assemble the workpiece
  stack_and_cover_480_ar5: stack two cubes and cover them with a cup
  pick_and_place_ar5: pick up three cubes and place them in the corresponding color regions
  drag_drawer_and_pick_place_ar5: open the drawer and put the cube inside
